<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLMusic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Страницы */
        .page {
            display: none;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .page.active {
            display: block;
        }

        /* Стартовая страница */
        .landing-page {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #000;
        }

        .landing-page.active {
            display: flex;
        }

        .landing-page h1 {
            font-size: 4em;
            margin-bottom: 20px;
            color: #000;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }

        .landing-page p {
            font-size: 1.5em;
            margin-bottom: 40px;
            color: #000;
        }

        .start-btn {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 20px 60px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            background: #fff;
            color: #000;
            transform: scale(1.1);
        }

        /* Страница проигрывателя */
        .player-page {
            display: none;
            padding: 20px;
        }

        .player-page.active {
            display: block;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 30px;
            padding: 20px;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            color: #000;
        }

        .home-btn {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: none;
            padding: 10px 25px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: #fff;
            color: #000;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            color: #000;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .player {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid #000;
        }

        .now-playing {
            text-align: center;
            margin-bottom: 20px;
        }

        .now-playing h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #000;
        }

        .now-playing p {
            color: #333;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .controls button {
            background: #000;
            border: none;
            color: #fff;
            padding: 15px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s ease;
        }

        .controls button:hover {
            background: #333;
            transform: scale(1.1);
        }

        .controls button:active {
            transform: scale(0.95);
        }

        .progress-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #ccc;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }

        .progress {
            height: 100%;
            background: #000;
            border-radius: 5px;
            width: 0%;
            transition: width 0.1s ease;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9em;
            color: #333;
        }

        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .volume-control input[type="range"] {
            width: 200px;
            cursor: pointer;
        }

        /* Эквалайзер */
        .equalizer {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid #000;
        }

        .equalizer h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #000;
        }

        .eq-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .eq-band {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .eq-band label {
            font-size: 0.8em;
            color: #000;
            margin-bottom: 5px;
        }

        .eq-band input[type="range"] {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 8px;
            height: 100px;
            cursor: pointer;
        }

        .eq-visualizer {
            margin-top: 20px;
            height: 150px;
            background: #000;
            border-radius: 10px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            padding: 10px;
            overflow: hidden;
        }

        .eq-bar {
            width: 20px;
            background: linear-gradient(to top, #00ff00, #ffff00, #ff0000);
            border-radius: 3px 3px 0 0;
            transition: height 0.1s ease;
        }

        .add-music {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            border: 2px solid #000;
        }

        .add-music h3 {
            margin-bottom: 20px;
            text-align: center;
            color: #000;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .file-input-btn {
            background: #000;
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            text-align: center;
            display: block;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-input-btn:hover {
            background: #333;
        }

        .playlist {
            margin-top: 30px;
        }

        .playlist h3 {
            margin-bottom: 15px;
            color: #000;
        }

        .playlist-items {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .playlist-item {
            background: rgba(0, 0, 0, 0.1);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .playlist-item:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        .playlist-item.active {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid #000;
        }

        .playlist-item span {
            color: #000;
        }

        .playlist-item .delete-btn {
            background: rgba(255, 0, 0, 0.7);
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
        }

        .playlist-item .delete-btn:hover {
            background: rgba(255, 0, 0, 1);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- Стартовая страница -->
    <div class="landing-page active" id="landing-page">
        <h1>🎵 LLMusic</h1>
        <p>Ваш персональный музыкальный проигрыватель</p>
        <button class="start-btn" onclick="goToPlayer()">Начать</button>
    </div>

    <!-- Страница проигрывателя -->
    <div class="player-page" id="player-page">
        <div class="nav-header">
            <div class="logo">🎵 LLMusic</div>
            <button class="home-btn" onclick="goToLanding()">Главная</button>
        </div>

        <div class="container">
            <div class="main-content">
                <div class="player">
                    <div class="now-playing">
                        <h2 id="track-name">Нет трека</h2>
                        <p id="artist-name">Добавьте музыку</p>
                    </div>

                    <audio id="audio"></audio>

                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar">
                            <div class="progress" id="progress"></div>
                        </div>
                        <div class="time-display">
                            <span id="current-time">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>

                    <div class="controls">
                        <button id="prev-btn">⏮</button>
                        <button id="play-btn">▶</button>
                        <button id="next-btn">⏭</button>
                    </div>

                    <div class="volume-control">
                        <span>🔊</span>
                        <input type="range" id="volume" min="0" max="100" value="70">
                    </div>
                </div>

                <div class="equalizer">
                    <h3>🎚️ Эквалайзер</h3>
                    <div class="eq-controls">
                        <div class="eq-band">
                            <label>60Hz</label>
                            <input type="range" class="eq-slider" data-freq="60" min="-12" max="12" value="0" orient="vertical">
                        </div>
                        <div class="eq-band">
                            <label>170Hz</label>
                            <input type="range" class="eq-slider" data-freq="170" min="-12" max="12" value="0" orient="vertical">
                        </div>
                        <div class="eq-band">
                            <label>310Hz</label>
                            <input type="range" class="eq-slider" data-freq="310" min="-12" max="12" value="0" orient="vertical">
                        </div>
                        <div class="eq-band">
                            <label>600Hz</label>
                            <input type="range" class="eq-slider" data-freq="600" min="-12" max="12" value="0" orient="vertical">
                        </div>
                        <div class="eq-band">
                            <label>1kHz</label>
                            <input type="range" class="eq-slider" data-freq="1000" min="-12" max="12" value="0" orient="vertical">
                        </div>
                        <div class="eq-band">
                            <label>3kHz</label>
                            <input type="range" class="eq-slider" data-freq="3000" min="-12" max="12" value="0" orient="vertical">
                        </div>
                        <div class="eq-band">
                            <label>6kHz</label>
                            <input type="range" class="eq-slider" data-freq="6000" min="-12" max="12" value="0" orient="vertical">
                        </div>
                        <div class="eq-band">
                            <label>12kHz</label>
                            <input type="range" class="eq-slider" data-freq="12000" min="-12" max="12" value="0" orient="vertical">
                        </div>
                        <div class="eq-band">
                            <label>14kHz</label>
                            <input type="range" class="eq-slider" data-freq="14000" min="-12" max="12" value="0" orient="vertical">
                        </div>
                        <div class="eq-band">
                            <label>16kHz</label>
                            <input type="range" class="eq-slider" data-freq="16000" min="-12" max="12" value="0" orient="vertical">
                        </div>
                    </div>
                    <div class="eq-visualizer" id="eq-visualizer">
                        <!-- Bars will be generated by JS -->
                    </div>
                </div>
            </div>

            <div class="add-music">
                <h3>Добавить музыку</h3>
                <div class="file-input-wrapper">
                    <div class="file-input-btn">📁 Выберите аудиофайл (MP3, WAV, OGG)</div>
                    <input type="file" id="file-input" accept="audio/*" multiple>
                </div>

                <div class="playlist">
                    <h3>Плейлист</h3>
                    <ul class="playlist-items" id="playlist-items"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Навигация между страницами
        function goToPlayer() {
            document.getElementById('landing-page').classList.remove('active');
            document.getElementById('player-page').classList.add('active');
            initAudioContext();
        }

        function goToLanding() {
            document.getElementById('player-page').classList.remove('active');
            document.getElementById('landing-page').classList.add('active');
            if (audio && !audio.paused) {
                audio.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
            }
        }

        // Canvas setup for rotating planet
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let points = [];
        const numPoints = 1000;
        const radius = 200;
        let angleX = 0;
        let angleY = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generatePoints();
        }

        function generatePoints() {
            points = [];
            for (let i = 0; i < numPoints; i++) {
                const phi = Math.acos(-1 + (2 * i) / numPoints);
                const theta = Math.sqrt(numPoints * Math.PI) * phi;
                
                const x = radius * Math.cos(theta) * Math.sin(phi);
                const y = radius * Math.sin(theta) * Math.sin(phi);
                const z = radius * Math.cos(phi);
                
                points.push({ x, y, z });
            }
        }

        function rotatePoint(point, angleX, angleY) {
            let x = point.x;
            let y = point.y;
            let z = point.z;

            // Rotate around X axis
            let y1 = y * Math.cos(angleX) - z * Math.sin(angleX);
            let z1 = y * Math.sin(angleX) + z * Math.cos(angleX);

            // Rotate around Y axis
            let x2 = x * Math.cos(angleY) + z1 * Math.sin(angleY);
            let z2 = -x * Math.sin(angleY) + z1 * Math.cos(angleY);

            return { x: x2, y: y1, z: z2 };
        }

        function animate() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            angleX += 0.005;
            angleY += 0.007;

            points.forEach(point => {
                const rotated = rotatePoint(point, angleX, angleY);
                
                const scale = 300 / (300 + rotated.z);
                const x2d = centerX + rotated.x * scale;
                const y2d = centerY + rotated.y * scale;

                const alpha = (rotated.z + radius) / (2 * radius);
                const size = Math.max(1, 2 * scale);

                ctx.beginPath();
                ctx.arc(x2d, y2d, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();

        // Эквалайзер и аудио контекст
        let audioContext;
        let analyser;
        let source;
        let eqFilters = [];
        let eqVisualizerBars = [];

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 64;
                
                // Создаем фильтры для эквалайзера
                const frequencies = [60, 170, 310, 600, 1000, 3000, 6000, 12000, 14000, 16000];
                frequencies.forEach(freq => {
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'peaking';
                    filter.frequency.value = freq;
                    filter.Q.value = 1.4;
                    filter.gain.value = 0;
                    eqFilters.push(filter);
                });

                // Создаем бары для визуализатора
                const visualizer = document.getElementById('eq-visualizer');
                visualizer.innerHTML = '';
                for (let i = 0; i < 10; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'eq-bar';
                    bar.style.height = '5px';
                    visualizer.appendChild(bar);
                    eqVisualizerBars.push(bar);
                }

                // Подключаем эквалайзер к аудио элементу
                connectAudio();
                
                // Настраиваем слайдеры эквалайзера
                setupEqSliders();
                
                // Запускаем визуализатор
                updateVisualizer();
            }
        }

        function connectAudio() {
            if (source) {
                source.disconnect();
            }
            source = audioContext.createMediaElementSource(audio);
            
            // Цепочка: source -> eq filters -> analyser -> destination
            let lastNode = source;
            eqFilters.forEach(filter => {
                lastNode.connect(filter);
                lastNode = filter;
            });
            lastNode.connect(analyser);
            analyser.connect(audioContext.destination);
        }

        function setupEqSliders() {
            const sliders = document.querySelectorAll('.eq-slider');
            sliders.forEach((slider, index) => {
                slider.addEventListener('input', () => {
                    if (eqFilters[index]) {
                        eqFilters[index].gain.value = parseFloat(slider.value);
                    }
                });
            });
        }

        function updateVisualizer() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            function render() {
                requestAnimationFrame(render);
                analyser.getByteFrequencyData(dataArray);
                
                const step = Math.floor(dataArray.length / 10);
                for (let i = 0; i < 10; i++) {
                    const value = dataArray[i * step];
                    const percent = value / 255;
                    const height = Math.max(5, percent * 130);
                    eqVisualizerBars[i].style.height = height + 'px';
                }
            }
            
            render();
        }

        // Music Player Logic
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volume');
        const fileInput = document.getElementById('file-input');
        const playlistItems = document.getElementById('playlist-items');
        const trackName = document.getElementById('track-name');
        const artistName = document.getElementById('artist-name');

        let playlist = [];
        let currentTrackIndex = 0;
        let isPlaying = false;

        // Load playlist from localStorage
        function loadPlaylist() {
            const savedPlaylist = localStorage.getItem('musicPlaylist');
            if (savedPlaylist) {
                try {
                    playlist = JSON.parse(savedPlaylist);
                    renderPlaylist();
                    if (playlist.length > 0) {
                        loadTrack(0);
                    }
                } catch (e) {
                    console.error('Ошибка загрузки плейлиста:', e);
                    playlist = [];
                }
            }
        }

        // Save playlist to localStorage
        function savePlaylist() {
            try {
                localStorage.setItem('musicPlaylist', JSON.stringify(playlist));
            } catch (e) {
                console.error('Ошибка сохранения плейлиста:', e);
                alert('Плейлист слишком большой для сохранения в localStorage. Некоторые треки могут не сохраниться.');
            }
        }

        // Format time
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Load track
        function loadTrack(index) {
            if (playlist.length === 0) return;
            
            currentTrackIndex = index;
            const track = playlist[index];
            
            audio.src = track.data;
            trackName.textContent = track.name;
            artistName.textContent = 'Локальный файл';
            
            updatePlaylistUI();
        }

        // Play/Pause
        function togglePlay() {
            if (playlist.length === 0) return;
            
            // Инициализируем аудио контекст при первом воспроизведении
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶';
            } else {
                audio.play().catch(e => {
                    console.error('Ошибка воспроизведения:', e);
                    alert('Ошибка воспроизведения. Попробуйте добавить другой файл.');
                });
                playBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        }

        // Previous track
        function prevTrack() {
            if (playlist.length === 0) return;
            
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                audio.play();
            }
        }

        // Next track
        function nextTrack() {
            if (playlist.length === 0) return;
            
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                audio.play();
            }
        }

        // Update progress bar
        function updateProgress() {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progress.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationEl.textContent = formatTime(audio.duration);
            }
        }

        // Set progress
        function setProgress(e) {
            if (!audio.duration) return;
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }

        // Set volume
        function setVolume() {
            audio.volume = volumeSlider.value / 100;
        }

        // Render playlist
        function renderPlaylist() {
            playlistItems.innerHTML = '';
            
            playlist.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = 'playlist-item';
                if (index === currentTrackIndex) {
                    li.classList.add('active');
                }
                
                li.innerHTML = `
                    <span>${track.name}</span>
                    <button class="delete-btn" onclick="deleteTrack(${index}, event)">🗑</button>
                `;
                
                li.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('delete-btn')) {
                        loadTrack(index);
                        if (isPlaying) {
                            audio.play();
                        }
                    }
                });
                
                playlistItems.appendChild(li);
            });
        }

        // Update playlist UI
        function updatePlaylistUI() {
            const items = playlistItems.querySelectorAll('.playlist-item');
            items.forEach((item, index) => {
                if (index === currentTrackIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // Delete track
        function deleteTrack(index, event) {
            event.stopPropagation();
            playlist.splice(index, 1);
            savePlaylist();
            renderPlaylist();
            
            if (playlist.length === 0) {
                audio.src = '';
                trackName.textContent = 'Нет трека';
                artistName.textContent = 'Добавьте музыку';
                isPlaying = false;
                playBtn.textContent = '▶';
            } else if (index === currentTrackIndex) {
                currentTrackIndex = Math.min(currentTrackIndex, playlist.length - 1);
                loadTrack(currentTrackIndex);
                if (isPlaying) {
                    audio.play();
                }
            } else if (index < currentTrackIndex) {
                currentTrackIndex--;
                updatePlaylistUI();
            }
        }

        // Make deleteTrack globally accessible
        window.deleteTrack = deleteTrack;
        window.goToPlayer = goToPlayer;
        window.goToLanding = goToLanding;

        // Handle file upload
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            
            if (files.length === 0) return;
            
            files.forEach(file => {
                const reader = new FileReader();
                
                reader.onload = (event) => {
                    const track = {
                        name: file.name.replace(/\.[^/.]+$/, ''),
                        data: event.target.result,
                        type: file.type
                    };
                    
                    playlist.push(track);
                    savePlaylist();
                    renderPlaylist();
                    
                    if (playlist.length === 1) {
                        loadTrack(0);
                    }
                };
                
                reader.onerror = () => {
                    console.error('Ошибка чтения файла:', file.name);
                };
                
                reader.readAsDataURL(file);
            });
            
            fileInput.value = '';
        });

        // Event listeners
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', nextTrack);
        progressBar.addEventListener('click', setProgress);
        volumeSlider.addEventListener('input', setVolume);
        
        // Инициализация при загрузке страницы
        audio.addEventListener('loadedmetadata', () => {
            if (audioContext && source) {
                // Переподключаем источник после загрузки нового трека
                connectAudio();
            }
        });

        // Initialize
        loadPlaylist();
        setVolume();
    </script>
</body>
</html>
