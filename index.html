<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLMusic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #000;
            color: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Glassmorphism styles */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .page {
            display: none;
            width: 90%;
            max-width: 800px;
            padding: 40px;
            text-align: center;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #000;
            text-shadow: none;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #000;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: rgba(0, 0, 0, 0.8);
        }

        .btn {
            background: rgba(0, 0, 0, 0.1);
            color: #000;
            border: 1px solid rgba(0, 0, 0, 0.2);
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            margin: 10px;
        }

        .btn:hover {
            background: rgba(0, 0, 0, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Player styles */
        .player-container {
            width: 100%;
        }

        .track-info {
            margin-bottom: 30px;
        }

        .track-name {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #000;
        }

        .artist-name {
            font-size: 1rem;
            color: rgba(0, 0, 0, 0.6);
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 20px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #000, rgba(0, 0, 0, 0.5));
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: rgba(0, 0, 0, 0.6);
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-btn {
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.2);
            color: #000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(0, 0, 0, 0.2);
            transform: scale(1.1);
        }

        .play-btn {
            width: 70px;
            height: 70px;
            font-size: 1.5rem;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .volume-slider {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #000;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Equalizer */
        .equalizer-container {
            margin-bottom: 30px;
            padding: 20px;
        }

        .equalizer-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #000;
        }

        .equalizer {
            display: flex;
            justify-content: space-between;
            height: 150px;
            align-items: flex-end;
            gap: 5px;
        }

        .eq-band {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .eq-slider-container {
            width: 30px;
            height: 100px;
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            margin-bottom: 5px;
        }

        .eq-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 6px;
            background: transparent;
            outline: none;
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, 50%) rotate(-90deg);
            transform-origin: center;
        }

        .eq-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .eq-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .eq-label {
            font-size: 0.7rem;
            color: rgba(0, 0, 0, 0.6);
            margin-top: 5px;
        }

        /* Playlist */
        .playlist-container {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .playlist-item:hover {
            background: rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .playlist-item.active {
            background: rgba(0, 0, 0, 0.15);
            border-left: 3px solid #000;
        }

        .playlist-item-name {
            flex: 1;
            color: #000;
        }

        .delete-btn {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: rgba(255, 0, 0, 0.4);
            transform: scale(1.1);
        }

        .file-input {
            display: none;
        }

        .visualizer {
            width: 100%;
            height: 80px;
            margin-bottom: 20px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.05);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="container">
        <!-- Start Page -->
        <div id="start-page" class="page glass active">
            <h1>LLMusic</h1>
            <p>Ваш персональный музыкальный проигрыватель</p>
            <button class="btn" onclick="showPage('main-page')">Начать</button>
        </div>

        <!-- Main Page -->
        <div id="main-page" class="page glass">
            <h2>Добро пожаловать в LLMusic</h2>
            <p>Загрузите свою музыку и наслаждайтесь прослушиванием</p>
            <button class="btn" onclick="showPage('player-page')">Открыть проигрыватель</button>
        </div>

        <!-- Player Page -->
        <div id="player-page" class="page glass">
            <div class="player-container">
                <canvas id="visualizer" class="visualizer"></canvas>
                
                <div class="track-info">
                    <div class="track-name" id="track-name">Нет трека</div>
                    <div class="artist-name" id="artist-name">Добавьте музыку</div>
                </div>

                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>

                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>

                <div class="controls">
                    <button class="control-btn" onclick="prevTrack()">⏮</button>
                    <button class="control-btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
                    <button class="control-btn" onclick="nextTrack()">⏭</button>
                </div>

                <div class="volume-container">
                    <span>🔈</span>
                    <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
                    <span>🔊</span>
                </div>

                <div class="equalizer-container glass">
                    <div class="equalizer-title">Эквалайзер</div>
                    <div class="equalizer" id="equalizer">
                        <!-- Equalizer bands will be generated here -->
                    </div>
                </div>

                <button class="btn" onclick="document.getElementById('file-input').click()">Выберите аудиофайл</button>
                <input type="file" id="file-input" class="file-input" accept="audio/*" multiple>

                <div class="playlist-container" id="playlist">
                    <!-- Playlist items will be added here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Canvas animation for rotating planet
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        const particleCount = 800;
        let rotation = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initParticles();
        }

        function initParticles() {
            particles = [];
            const radius = Math.min(width, height) * 0.3;
            
            for (let i = 0; i < particleCount; i++) {
                const phi = Math.acos(-1 + (2 * i) / particleCount);
                const theta = Math.sqrt(particleCount * Math.PI) * phi;
                
                const x = radius * Math.cos(theta) * Math.sin(phi);
                const y = radius * Math.sin(theta) * Math.sin(phi);
                const z = radius * Math.cos(phi);
                
                particles.push({ x, y, z, baseX: x, baseY: y, baseZ: z });
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, width, height);
            
            rotation += 0.003;
            
            const centerX = width / 2;
            const centerY = height / 2;
            
            particles.forEach(p => {
                // Rotate around Y axis
                const cosR = Math.cos(rotation);
                const sinR = Math.sin(rotation);
                
                const x = p.baseX * cosR - p.baseZ * sinR;
                const z = p.baseX * sinR + p.baseZ * cosR;
                const y = p.baseY;
                
                // Perspective projection
                const scale = 300 / (300 + z);
                const px = x * scale + centerX;
                const py = y * scale + centerY;
                
                const size = Math.max(1, 2 * scale);
                const alpha = Math.max(0.2, (z + radius) / (2 * radius));
                
                ctx.beginPath();
                ctx.arc(px, py, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            });
            
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();

        // Music Player
        let audio = new Audio();
        let playlist = [];
        let currentTrackIndex = 0;
        let isPlaying = false;
        let audioContext, analyser, source;
        let eqFilters = [];
        const freqLabels = ['60', '170', '310', '600', '1K', '3K', '6K', '12K', '14K', '16K'];
        const eqFrequencies = [60, 170, 310, 600, 1000, 3000, 6000, 12000, 14000, 16000];

        // Initialize equalizer
        function initEqualizer() {
            const equalizerDiv = document.getElementById('equalizer');
            equalizerDiv.innerHTML = '';
            
            eqFrequencies.forEach((freq, index) => {
                const band = document.createElement('div');
                band.className = 'eq-band';
                
                const sliderContainer = document.createElement('div');
                sliderContainer.className = 'eq-slider-container';
                
                const slider = document.createElement('input');
                slider.type = 'range';
                slider.className = 'eq-slider';
                slider.min = -12;
                slider.max = 12;
                slider.value = 0;
                slider.step = 1;
                slider.dataset.index = index;
                
                slider.addEventListener('input', (e) => {
                    if (eqFilters[index]) {
                        eqFilters[index].gain.value = e.target.value;
                    }
                });
                
                sliderContainer.appendChild(slider);
                
                const label = document.createElement('div');
                label.className = 'eq-label';
                label.textContent = freqLabels[index];
                
                band.appendChild(sliderContainer);
                band.appendChild(label);
                equalizerDiv.appendChild(band);
            });
        }

        function setupAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                
                source = audioContext.createMediaElementSource(audio);
                
                // Create equalizer filters
                eqFilters = eqFrequencies.map(freq => {
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'peaking';
                    filter.frequency.value = freq;
                    filter.Q.value = 1;
                    filter.gain.value = 0;
                    return filter;
                });
                
                // Connect nodes: source -> eq1 -> eq2 -> ... -> analyser -> destination
                source.connect(eqFilters[0]);
                for (let i = 0; i < eqFilters.length - 1; i++) {
                    eqFilters[i].connect(eqFilters[i + 1]);
                }
                eqFilters[eqFilters.length - 1].connect(analyser);
                analyser.connect(audioContext.destination);
                
                visualize();
            }
            
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function visualize() {
            const visualizer = document.getElementById('visualizer');
            const visCtx = visualizer.getContext('2d');
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            visualizer.width = visualizer.offsetWidth;
            visualizer.height = visualizer.offsetHeight;
            
            function draw() {
                requestAnimationFrame(draw);
                
                analyser.getByteFrequencyData(dataArray);
                
                visCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                visCtx.fillRect(0, 0, visualizer.width, visualizer.height);
                
                const barWidth = (visualizer.width / bufferLength) * 2.5;
                let barHeight;
                let x = 0;
                
                for (let i = 0; i < bufferLength; i++) {
                    barHeight = dataArray[i] / 2;
                    
                    const gradient = visCtx.createLinearGradient(0, visualizer.height, 0, 0);
                    gradient.addColorStop(0, 'rgba(0, 0, 0, 0.3)');
                    gradient.addColorStop(1, 'rgba(0, 0, 0, 0.8)');
                    
                    visCtx.fillStyle = gradient;
                    visCtx.fillRect(x, visualizer.height - barHeight, barWidth, barHeight);
                    
                    x += barWidth + 1;
                }
            }
            
            draw();
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
            
            if (pageId === 'player-page') {
                loadPlaylist();
                setupAudioContext();
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function loadPlaylist() {
            const savedPlaylist = localStorage.getItem('llmusic_playlist');
            if (savedPlaylist) {
                playlist = JSON.parse(savedPlaylist);
                renderPlaylist();
                if (playlist.length > 0) {
                    loadTrack(0);
                }
            }
        }

        function savePlaylist() {
            localStorage.setItem('llmusic_playlist', JSON.stringify(playlist));
        }

        function renderPlaylist() {
            const playlistDiv = document.getElementById('playlist');
            playlistDiv.innerHTML = '';
            
            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                if (index === currentTrackIndex) {
                    item.classList.add('active');
                }
                
                const name = document.createElement('div');
                name.className = 'playlist-item-name';
                name.textContent = track.name;
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '×';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteTrack(index);
                };
                
                item.appendChild(name);
                item.appendChild(deleteBtn);
                item.onclick = () => playTrack(index);
                
                playlistDiv.appendChild(item);
            });
        }

        function addTrack(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const track = {
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    data: e.target.result,
                    type: file.type
                };
                
                playlist.push(track);
                savePlaylist();
                renderPlaylist();
                
                if (playlist.length === 1) {
                    loadTrack(0);
                }
            };
            reader.readAsDataURL(file);
        }

        function loadTrack(index) {
            if (index >= 0 && index < playlist.length) {
                currentTrackIndex = index;
                audio.src = playlist[index].data;
                document.getElementById('track-name').textContent = playlist[index].name;
                document.getElementById('artist-name').textContent = 'Локальный трек';
                renderPlaylist();
            }
        }

        function playTrack(index) {
            loadTrack(index);
            togglePlay();
        }

        function togglePlay() {
            setupAudioContext();
            
            if (isPlaying) {
                audio.pause();
                document.getElementById('play-btn').textContent = '▶';
            } else {
                if (audio.src) {
                    audio.play().then(() => {
                        isPlaying = true;
                        document.getElementById('play-btn').textContent = '⏸';
                    }).catch(err => {
                        console.error('Playback failed:', err);
                        alert('Не удалось воспроизвести трек. Убедитесь, что файл корректен.');
                    });
                } else {
                    alert('Сначала добавьте музыку в плейлист');
                }
            }
        }

        function prevTrack() {
            if (currentTrackIndex > 0) {
                playTrack(currentTrackIndex - 1);
            } else if (playlist.length > 0) {
                playTrack(playlist.length - 1);
            }
        }

        function nextTrack() {
            if (currentTrackIndex < playlist.length - 1) {
                playTrack(currentTrackIndex + 1);
            } else if (playlist.length > 0) {
                playTrack(0);
            }
        }

        function deleteTrack(index) {
            playlist.splice(index, 1);
            savePlaylist();
            
            if (playlist.length === 0) {
                audio.pause();
                audio.src = '';
                document.getElementById('track-name').textContent = 'Нет трека';
                document.getElementById('artist-name').textContent = 'Добавьте музыку';
                document.getElementById('play-btn').textContent = '▶';
                isPlaying = false;
            } else if (index === currentTrackIndex) {
                if (index >= playlist.length) {
                    currentTrackIndex = playlist.length - 1;
                }
                loadTrack(currentTrackIndex);
                if (isPlaying) {
                    audio.play();
                }
            } else if (index < currentTrackIndex) {
                currentTrackIndex--;
            }
            
            renderPlaylist();
        }

        // Event listeners
        document.getElementById('file-input').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => addTrack(file));
            this.value = '';
        });

        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('current-time').textContent = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            document.getElementById('duration').textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', nextTrack);

        document.getElementById('progress-container').addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        });

        document.getElementById('volume-slider').addEventListener('input', function(e) {
            audio.volume = e.target.value;
        });

        // Initialize
        initEqualizer();
        loadPlaylist();
    </script>
</body>
</html>
